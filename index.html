<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psych Atlas</title>
<meta name="description" content="Dan Lockwood's single point of detail for psychology: BSc and MSc Forensic Psychology knowledge base with spaced retrieval practice.">
<meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Psych Atlas">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5fa;--surface:#ffffff;--surface-2:#eef0f7;--border:#dfe2ec;--text:#141724;--muted:#5d6377;--faint:#8b90a5;
  --primary:#4f46e5;--primary-ink:#ffffff;--primary-soft:#e8e7fd;
  --again:#d32f2f;--hard:#d97706;--good:#16a34a;--easy:#2563eb;
  --again-soft:#fdeaea;--hard-soft:#fff1dc;--good-soft:#e5f7ea;--easy-soft:#e3edfd;
  --msc:#7c3aed;--y3:#db2777;--y2:#0891b2;--y1:#16a34a;--practice:#ea580c;--rm:#0d9488;
  --core:#2563eb;--clinical:#dc2626;--specialities:#a16207;
  --shadow:0 1px 2px rgba(20,23,36,.06),0 8px 24px -12px rgba(20,23,36,.18);
  --radius:16px;--radius-sm:10px;--nav-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs:16px;
}
:root[data-theme="dark"]{
  --bg:#0e1017;--surface:#161923;--surface-2:#1e2230;--border:#2a2f40;--text:#e9ebf3;--muted:#a3a8bb;--faint:#6f7489;
  --primary:#8b85ff;--primary-ink:#0e1017;--primary-soft:#26264a;
  --again:#f87171;--hard:#fbbf24;--good:#4ade80;--easy:#60a5fa;
  --again-soft:#3a1c1c;--hard-soft:#3a2d12;--good-soft:#14301f;--easy-soft:#16273f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --msc:#a78bfa;--y3:#f472b6;--y2:#22d3ee;--y1:#4ade80;--practice:#fb923c;--core:#60a5fa;--clinical:#f87171;--specialities:#facc15;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1017;--surface:#161923;--surface-2:#1e2230;--border:#2a2f40;--text:#e9ebf3;--muted:#a3a8bb;--faint:#6f7489;
    --primary:#8b85ff;--primary-ink:#0e1017;--primary-soft:#26264a;
    --again:#f87171;--hard:#fbbf24;--good:#4ade80;--easy:#60a5fa;
    --again-soft:#3a1c1c;--hard-soft:#3a2d12;--good-soft:#14301f;--easy-soft:#16273f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --msc:#a78bfa;--y3:#f472b6;--y2:#22d3ee;--y1:#4ade80;--practice:#fb923c;--core:#60a5fa;--clinical:#f87171;--specialities:#facc15;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--primary);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.topnav{display:none;gap:4px;margin-left:8px}
.topnav a{padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:.92rem}
.topnav a.active{background:var(--primary-soft);color:var(--primary)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.hot{background:var(--hard-soft);color:var(--hard)}
main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
@media (min-width:760px){ .topnav{display:flex} .bottomnav{display:none} main{padding-bottom:48px} }

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:.68rem;font-weight:600}
.bottomnav a.active{color:var(--primary)}
.bottomnav svg{width:22px;height:22px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.grid3{gap:8px}.grid3 .stat{padding:12px 10px}.grid3 .stat .v{font-size:1.35rem}.grid3 .stat .l{font-size:.72rem}}
.h1{font-size:1.6rem;font-weight:800}
.h2{font-size:1.2rem;font-weight:700}
.h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:.95rem;border:1px solid transparent;transition:transform .08s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stat{padding:14px;border-radius:var(--radius-sm);background:var(--surface-2)}
.stat .v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:2px}
.list{display:flex;flex-direction:column}
.list>*{padding:12px 0;border-top:1px solid var(--border)}
.list>*:first-child{border-top:0;padding-top:0}
.list>*:last-child{padding-bottom:0}
.item{display:flex;align-items:center;gap:12px;color:inherit;width:100%;text-align:left}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:.84rem}
.chev{margin-left:auto;color:var(--faint);flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.tag.msc{background:color-mix(in srgb,var(--msc) 14%,transparent);color:var(--msc)}
.tag.y3{background:color-mix(in srgb,var(--y3) 14%,transparent);color:var(--y3)}
.tag.y2{background:color-mix(in srgb,var(--y2) 14%,transparent);color:var(--y2)}
.tag.y1{background:color-mix(in srgb,var(--y1) 14%,transparent);color:var(--y1)}
.tag.practice{background:color-mix(in srgb,var(--practice) 14%,transparent);color:var(--practice)}
.tag.rm{background:color-mix(in srgb,var(--rm) 14%,transparent);color:var(--rm)}
.tag.core{background:color-mix(in srgb,var(--core) 14%,transparent);color:var(--core)}
.tag.clinical{background:color-mix(in srgb,var(--clinical) 14%,transparent);color:var(--clinical)}
.tag.specialities{background:color-mix(in srgb,var(--specialities) 16%,transparent);color:var(--specialities)}
.tag.ext{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s ease}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>b{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.85rem;font-weight:800}

/* session */
.session{display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 56px - var(--nav-h) - 48px)}
.session-head{display:flex;align-items:center;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px;flex:1;display:flex;flex-direction:column;gap:14px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.qcard{animation:none}.btn{transition:none}}
.qcard .front{font-size:1.2rem;font-weight:600;line-height:1.45}
.qcard .front.big{font-size:1.35rem}
.qcard .back{border-top:1px dashed var(--border);padding-top:14px;font-size:1.05rem;line-height:1.55}
.qcard .back .md p+p{margin-top:8px}
.cloze{background:var(--primary-soft);color:var(--primary);padding:0 6px;border-radius:6px;font-weight:700}
.cloze.blank{letter-spacing:.1em}
.hint{font-size:.9rem;color:var(--muted);background:var(--surface-2);padding:8px 12px;border-radius:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;font-weight:800;border:1px solid transparent}
.grade small{font-weight:600;font-size:.72rem;opacity:.85}
.grade.again{background:var(--again-soft);color:var(--again)}
.grade.hard{background:var(--hard-soft);color:var(--hard)}
.grade.good{background:var(--good-soft);color:var(--good)}
.grade.easy{background:var(--easy-soft);color:var(--easy)}
.grade kbd{font-family:var(--mono);font-size:.68rem;opacity:.6}
textarea.ta{width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;line-height:1.5}
textarea.ta:focus{outline:2px solid var(--primary);border-color:transparent}
.kbdhint{display:none;color:var(--faint);font-size:.75rem}
@media (min-width:760px){.kbdhint{display:block}}

/* markdown */
.md{font-size:.98rem;line-height:1.6}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;font-weight:700}
.md h1{font-size:1.25rem}.md h2{font-size:1.12rem}.md h3{font-size:1rem}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md strong{font-weight:700}
.md code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.md table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.9rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--primary);background:var(--surface-2);border-radius:0 8px 8px 0;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;font-size:1rem;outline:none;min-width:0}
mark{background:color-mix(in srgb,var(--hard) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:10px;height:10px;border-radius:2px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--primary) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--primary) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--primary) 80%,var(--surface-2))}
.heat i.l4{background:var(--primary)}
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.forecast>div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.forecast b{width:100%;border-radius:6px 6px 2px 2px;background:var(--primary);min-height:2px;opacity:.85}
.forecast span{font-size:.68rem;color:var(--faint);font-weight:600}

/* settings */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--border)}
.field:first-child{border-top:0}
.field label{font-weight:600}
.field .desc{color:var(--muted);font-size:.84rem}
.field input[type=range]{width:100%}
.field select,.field input[type=number]{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);max-width:200px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.switch:first-child{border-top:0}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;flex:none;transition:background .15s}
.toggle[aria-checked="true"]{background:var(--primary)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:50;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{color:var(--primary-soft);font-weight:800}
@media (min-width:760px){.toast{bottom:24px}}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .big{font-size:2rem}
.srcpath{font-family:var(--mono);font-size:.74rem;color:var(--muted);word-break:break-all;background:var(--surface-2);padding:6px 8px;border-radius:8px}
details summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";font-size:.8em;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.studyrow{display:flex;gap:8px;flex-wrap:wrap}
.study{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.9rem;line-height:1.45}
.study b{display:block;font-size:.84rem;color:var(--primary)}
.keypoints li{margin:6px 0}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
.state-new{color:var(--easy)}.state-learning{color:var(--hard)}.state-review{color:var(--good)}.state-relearning{color:var(--again)}

/* v2 additions */
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--primary);color:var(--primary-ink);padding:8px 12px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
main:focus{outline:none}
main.in-session{padding-bottom:24px}
.backbtn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;min-height:40px}
.linkbtn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:.76rem;padding:6px 0;min-height:32px}
.linkbtn:hover{color:var(--again)}
.flagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.num{width:24px;flex:none;color:var(--faint);font-size:.85rem;font-weight:700;text-align:right;margin-right:4px}
.bar.thin{height:5px}
.card.inset{background:var(--surface-2);box-shadow:none}
.grades.three{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:.86rem;min-height:36px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);min-height:56px}
.choice:hover,.choice:focus-visible{border-color:var(--primary)}
.choice b{display:block;font-size:.95rem}
.choice small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px}
.choice .tag{min-width:58px;text-align:center}
.srclist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.done-mark{width:56px;height:56px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-size:1.6rem;font-weight:800}
.btn.danger{color:var(--again)}
.heat i.blank{background:transparent}
.keypoints{margin:0;padding-left:20px;line-height:1.55}
.keypoints li{margin:6px 0}
details.hint{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--muted)}
details.hint summary{font-weight:600}
.qcard .front strong{color:var(--primary)}
.forecast>div{justify-content:flex-end}
.forecast .tiny{color:var(--muted)}
a.pill{text-decoration:none}
.item{min-height:44px}
@media (hover:hover){.item:hover .t{color:var(--primary)}}

input[type=range],input[type=checkbox]{accent-color:var(--primary)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qhead .tag{white-space:nowrap}
.qhead .mini{white-space:nowrap}
.qtopic{margin-top:-6px}

/* v1.1: key learnings, references, coverage map */
.keylearn{margin:0;padding-left:22px;line-height:1.55}
.keylearn li{margin:7px 0;padding-left:2px}
.keylearn li::marker{color:var(--primary);font-weight:700}
.refs{margin:10px 0 0;padding-left:22px;font-size:.84rem;line-height:1.5;color:var(--text)}
.refs li{margin:6px 0;overflow-wrap:anywhere}
.refs a{overflow-wrap:anywhere}
.refmark{display:inline-block;margin-left:4px;font-size:.7rem;font-weight:700;border-radius:6px;padding:0 5px;vertical-align:1px}
.refmark.ok{color:var(--good);background:var(--good-soft)}
.refmark.off{color:var(--muted);background:var(--surface-2);font-style:italic;font-weight:600}
.whatsnew{border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border))}
.covlist{display:flex;flex-direction:column}
.covrow{padding:12px 0;border-top:1px solid var(--border)}
.covrow:first-child{border-top:0;padding-top:4px}
.covhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.covhead b{font-size:.95rem}
.covstat{display:inline-flex;align-items:center;gap:6px;flex:none}
.cov{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.cov.strong{color:var(--good);background:var(--good-soft)}
.cov.good{color:var(--easy);background:var(--easy-soft)}
.cov.introductory,.cov.partial,.cov.strong-but-dated{color:var(--hard);background:var(--hard-soft)}
.cov.missing{color:var(--again);background:var(--again-soft)}
.modchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 10px;font-size:.8rem;color:var(--text)}
@media (max-width:420px){.covhead{flex-direction:column;gap:6px}}

<script>window.PSYATLAS_METHOD_MD="# How Psych Atlas teaches\n\nThis app is built on the small set of learning techniques with the strongest recent evidence. Each one is applied deliberately, not decoratively.\n\n## 1. Retrieval practice, not re-reading\n\nEvery card asks you to pull an answer out of memory before you see it. A meta-analysis of 222 classroom studies found that quizzing produced a medium-sized improvement in later performance (g of about 0.50) compared with re-study or no quizzing, and the benefit held across subjects and ages (Yang et al., 2021). Switch on *Type answers* in Settings to force full generation rather than recognition.\n\n## 2. Spacing and successive relearning\n\nReviews are spread out over increasing intervals, and a card you fail is relearned rather than dropped. Carpenter et al. (2022) summarise the evidence that spacing and retrieval together produce durable learning, and Rawson and Dunlosky (2022) show that *successive relearning*, meaning retrieving to a criterion in several spaced sessions, is one of the most potent and under-used techniques for both obtaining and keeping knowledge.\n\n## 3. Interleaving across modules\n\nThe daily queue mixes modules rather than blocking one at a time, and avoids more than two consecutive cards from the same module where possible. Sana and Yan (2022) found that interleaving retrieval practice across related science concepts improved learning compared with blocked practice, particularly for telling similar concepts apart.\n\n## 4. A modern scheduler (FSRS-6)\n\nEach card carries three numbers: **difficulty**, **stability** (how long the memory lasts) and **retrievability** (the probability you can recall it right now). The scheduler picks the next review date so that retrievability falls to your target (default 90%) at the moment you see the card again. The formulas and default parameters are those of FSRS-6, the open-source scheduler that grew out of the stochastic-shortest-path approach to spaced repetition described by Ye et al. (2022) and now ships in Anki. Grade honestly: *Again* is information for the model, not a failure.\n\n## 5. Teach-back (Feynman)\n\nEach topic has a *Teach it* button. You write an explanation from memory, then compare it with the deep-dive notes and grade your own gaps. Lachner et al. (2022) reviewed learning-by-teaching without an audience and concluded it works when it makes you retrieve and elaborate, and works less well when you simply restate what is in front of you. Hence the rule: no peeking until you have written.\n\n## 6. Read, then retrieve\n\n*Up next to learn* on Today points you to the next unstarted topic in your focus. Read its notes once, then study its cards. New cards come only from the modules you choose as your focus, in the order they were taught, so each topic is encoded before it is tested; reviews then interleave everything you have started.\n\n## 7. Calibration\n\nGrade buttons show the interval each grade will produce, so you can see the consequence of an honest answer. True retention over the last 30 days is reported on the Progress page. If it sits well below your target, lower the number of new cards per day rather than lowering the target.\n\n## 8. Key learnings: compress, then expand\n\nEvery module opens with five to eight **key learnings**: the compressed teaching snapshot that ends a Feynman loop. Read them before a study session to activate what you already know, use them as prompts for a teach-back, and check at the end of a module that you could explain each one without the notes.\n\n## 9. Where the content comes from\n\n**Course modules (25).** Every topic, card and citation was generated from the lecture slides, notes, readings and coursework in your Psychology folder, and each topic lists the files it drew on. Citations were checked automatically against those files. Some sources were cut short or were image-only slides, so a few lectures are thinner than others.\n\n**Extension modules (20, marked Extension).** A gap analysis compared the course against BPS core knowledge, the seven HCPC practitioner titles, the wider fields of psychology and UK practice essentials (see the *Coverage map*). The gaps were filled with modules written from current published research, NICE guidance and legislation, each topic listing its references in APA 7 style. Every reference was checked in September 2026: 1,675 of 1,831 matched a Crossref record by title, author and year (DOIs were added or corrected for 759), 54 books were found in a library catalogue, 92 are official documents such as NICE guidance and legislation, and 10 classic books and chapters were confirmed by hand. None had to be removed. UK law, guidance and service facts are correct as of September 2026 and will date: re-check anything time-sensitive before relying on it in practice.\n\nIf a card looks wrong, use *Flag card* on the answer side: it is suspended until you restore it in Settings.\n\n## A sustainable routine\n\n- Do the due queue first, every day, ideally at the same time. Fifteen to twenty minutes is enough once the backlog is clear.\n- Keep new cards at 15 to 25 per day. Each new card creates roughly 8 to 12 reviews in its first year.\n- Once a week, open *Weak spots* on Today and run a teach-back on the two lowest topics.\n- Progress lives in this browser only. Export a backup from Settings before clearing browser data or changing device.\n\n## References\n\nCarpenter, S. K., Pan, S. C., & Butler, A. C. (2022). The science of effective learning with spacing and retrieval practice. *Nature Reviews Psychology, 1*, 496\u2013511. https://doi.org/10.1038/s44159-022-00089-1\n\nLachner, A., Hoogerheide, V., van Gog, T., & Renkl, A. (2022). Learning-by-teaching without audience presence or interaction: When and why does it work? *Educational Psychology Review, 34*, 575\u2013607. https://doi.org/10.1007/s10648-021-09643-4\n\nOpen Spaced Repetition. (2025). *The algorithm* [FSRS-6 specification and default parameters]. GitHub. https://github.com/open-spaced-repetition/awesome-fsrs/wiki/The-Algorithm\n\nRawson, K. A., & Dunlosky, J. (2022). Successive relearning: An underexplored but potent technique for obtaining and maintaining knowledge. *Current Directions in Psychological Science, 31*(4), 362\u2013368. https://doi.org/10.1177/09637214221100484\n\nSana, F., & Yan, V. X. (2022). Interleaving retrieval practice promotes science learning. *Psychological Science, 33*(5), 782\u2013788. https://doi.org/10.1177/09567976211057507\n\nYang, C., Luo, L., Vadillo, M. A., Yu, R., & Shanks, D. R. (2021). Testing (quizzing) boosts classroom learning: A systematic and meta-analytic review. *Psychological Bulletin, 147*(4), 399\u2013435. https://doi.org/10.1037/bul0000309\n\nYe, J., Su, J., & Cao, Y. (2022). A stochastic shortest path algorithm for optimizing spaced repetition scheduling. In *Proceedings of the 28th ACM SIGKDD Conference on Knowledge Discovery and Data Mining* (pp. 4381\u20134390). Association for Computing Machinery. https://doi.org/10.1145/3534678.3539081\n";</script>

    <div class="card">
      <div class="grid3">
        <div class="stat"><div class="v" style="color:var(--good)">${q.reviews.length}</div><div class="l">Due reviews</div></div>
        <div class="stat"><div class="v" style="color:var(--hard)">${q.learning.length}</div><div class="l">In learning</div></div>
        <div class="stat"><div class="v" style="color:var(--easy)">${q.fresh.length}</div><div class="l">New today</div></div>
      </div>
      <button class="btn primary block" style="margin-top:14px" disabled=${!total} onClick=${() => go('#/session')}>${total ? `Start session · ${plural(total, 'card')}` : 'Nothing due. Read ahead in the Atlas'}</button>
      <div class="row small muted" style="margin-top:10px;justify-content:space-between"><span>${plural(todayCount, 'review')} today</span><span>${st} day streak</span><span>${seen.toLocaleString('en-GB')} / ${CARDS.length.toLocaleString('en-GB')} seen</span></div>
      <div class="row small" style="margin-top:8px;justify-content:space-between"><span class="muted">New cards from: <b style="color:var(--text)">${focusLabel}</b></span><a href="#/settings">Change</a></div>
    </div>
    ${next ? html`<div class="card">
      <div class="eyebrow" style="margin-bottom:6px">Up next to learn</div>
      <div class="row" style="gap:12px;flex-wrap:nowrap"><${Dot} domainId=${MODULE[next.moduleId].domainId} /><div style="flex:1;min-width:0"><div class="t" style="font-weight:700">${next.title}</div><div class="small muted">${MODULE[next.moduleId].title}</div></div></div>
      <p class="small muted" style="margin-top:8px">Read the notes first, then retrieve. Reading before testing makes the first retrieval attempt productive rather than guesswork.</p>
      <div class="row" style="margin-top:10px"><a class="btn sm" href=${'#/atlas/topic/' + next.id}>Read notes</a><a class="btn sm ghost" href=${'#/session/topic/' + next.id}>Study its cards</a></div>
    </div>` : null}
    ${weak.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Weak spots · try a teach-back</div><div class="list">${weak.map(({ t, s }) => html`<a key=${t.id} class="item" href=${'#/atlas/topic/' + t.id}><${Dot} domainId=${MODULE[t.moduleId].domainId} /><div style="flex:1;min-width:0"><div class="t">${t.title}</div><div class="s">${MODULE[t.moduleId].short} · est. recall ${Math.round(s.meanR * 100)}%</div></div>${I.chev}</a>`)}</div></div>` : null}
    ${dueMods.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Due by module</div><div class="list">${dueMods.map(({ m, s }) => html`<a key=${m.id} class="item" href=${'#/session/module/' + m.id}><${Dot} domainId=${m.domainId} /><div style="flex:1;min-width:0"><div class="t">${m.title}</div><div class="bar" style="margin-top:6px"><i style=${{ width: Math.round(s.mastery * 100) + '%', background: dvar(m.domainId) }}></i></div></div><span class="pill hot">${s.due} due</span></a>`)}</div></div>` : null}
    <p class="tiny faint">${MODULES.length} modules · ${TOPICS.length} topics · ${CARDS.length.toLocaleString('en-GB')} cards · <a href="#/coverage">Coverage map</a> · <a href="#/method">How this app teaches</a></p>
  </div>`;
}

/* ---------- Session ---------- */
const FLAG_REASONS = [['inaccurate', 'Inaccurate'], ['unclear', 'Unclear'], ['duplicate', 'Duplicate'], ['not-useful', 'Not useful']];
function Session({ P, filterSpec }) {
  const filter = useMemo(() => !filterSpec ? null : filterSpec.type === 'module' ? (c => cardModule(c) === filterSpec.id) : filterSpec.type === 'topic' ? (c => c.topicId === filterSpec.id) : null, []);
  const [queue, setQueue] = useState(() => { const q = buildQueue(P, Date.now(), filter); return q.learning.concat(q.reviews, q.fresh); });
  const [done, setDone] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [typed, setTyped] = useState('');
  const [flagOpen, setFlagOpen] = useState(false);
  const [results, setResults] = useState([0, 0, 0, 0]);
  const startCount = useRef(queue.length);
  const card = queue[0];
  const topic = card ? TOPIC[card.topicId] : null, mod = topic ? MODULE[topic.moduleId] : null;
  const st = card ? P.states[card.id] : null;
  const ivls = card ? previewIntervals(st, Date.now(), P.settings) : [0, 0, 0, 0];
  const onGrade = useCallback(G => {
    if (!card) return;
    const nowT = Date.now(), next = schedule(st, G, nowT, P.settings);
    P.grade(card.id, G, nowT);
    setResults(r => r.map((x, i) => i === G - 1 ? x + 1 : x));
    setQueue(q => { const rest = q.slice(1); if (next.state === 'learning' || next.state === 'relearning') rest.splice(Math.min(rest.length, 4), 0, card); else setDone(d => d + 1); return rest; });
    setRevealed(false); setTyped(''); setFlagOpen(false);
  }, [card, st, P]);
  const onFlag = reason => { P.flag(card.id, reason); setQueue(q => q.slice(1)); setDone(d => d + 1); setRevealed(false); setFlagOpen(false); };
  useEffect(() => {
    const onKey = e => {
      if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) setRevealed(true); return; }
      if (!card) return;
      if (!revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); setRevealed(true); }
      else if (revealed && ['1', '2', '3', '4'].includes(e.key)) onGrade(Number(e.key));
    };
    addEventListener('keydown', onKey); return () => removeEventListener('keydown', onKey);
  }, [card, revealed, onGrade]);
  const total = startCount.current, pct = total ? Math.round(done / total * 100) : 100;
  const exit = filterSpec ? (filterSpec.type === 'module' ? '#/atlas/module/' + filterSpec.id : '#/atlas/topic/' + filterSpec.id) : '#/today';
  if (!card) {
    const n = results.reduce((a, b) => a + b, 0);
    return html`<div class="card" style="text-align:center;padding:32px 20px">
      <div class="done-mark" aria-hidden="true">✓</div>
      <h2 class="h2" style="margin-top:6px">${n ? 'Session complete' : 'Nothing to review here'}</h2>
      <p class="muted" style="margin-top:6px">${n ? `${plural(n, 'answer')} · ${Math.round((results[2] + results[3]) / n * 100)}% Good or Easy` : 'Come back when cards fall due, or open a topic to learn new ones.'}</p>
      ${n ? html`<div class="grades" style="margin:16px auto 0;max-width:420px">${['again', 'hard', 'good', 'easy'].map((k, i) => html`<div key=${k} class="grade ${k}" style="cursor:default"><span>${results[i]}</span><small>${k[0].toUpperCase() + k.slice(1)}</small></div>`)}</div>` : null}
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" onClick=${() => go('#/today')}>Back to Today</button>${filterSpec ? html`<button class="btn ghost" onClick=${() => go(exit)}>Back to topic</button>` : null}</div>
    </div>`;
  }
  const isCloze = card.type === 'cloze', stateLabel = st ? st.state : 'new';
  return html`<div class="session">
    <div class="session-head"><${Back} to=${exit} label="End" /><div class="bar" style="flex:1" role="progressbar" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><i style=${{ width: pct + '%' }}></i></div><span class="small muted">${done}/${total}</span></div>
    <div class="qcard" key=${card.id + ':' + (st ? st.reps : 0)}>
      <div class="qhead"><span class="tag ${DCLASS[mod.domainId]}">${mod.short}</span><span class="mini state-${stateLabel}">${card.type === 'apply' ? 'scenario' : card.type === 'qa' ? 'question' : card.type} · ${stateLabel}</span></div>
      <div class="tiny muted ellipsis qtopic">${topic.title}</div>
      <div class="front ${isCloze ? '' : 'big'}" dangerouslySetInnerHTML=${{ __html: isCloze ? (revealed ? clozeBack(card.front) : clozeFront(card.front)) : inlineMd(card.front) }}></div>
      ${!revealed && card.hint ? html`<details class="hint"><summary>Hint</summary><div style="margin-top:4px">${card.hint}</div></details>` : null}
      ${!revealed && P.settings.typeAnswer && !isCloze ? html`<textarea class="ta" aria-label="Your answer" placeholder="Answer from memory first…" value=${typed} onInput=${e => setTyped(e.target.value)}></textarea>` : null}
      ${revealed ? html`<div class="back">
        ${typed ? html`<div class="hint" style="margin-bottom:10px"><b>You wrote:</b> ${typed}</div>` : null}
        ${card.back ? html`<div class="md" dangerouslySetInnerHTML=${renderMd(card.back)}></div>` : null}
        <div class="row tiny faint" style="margin-top:10px;justify-content:space-between"><a href=${'#/atlas/topic/' + topic.id}>Open topic notes ›</a><button class="linkbtn" onClick=${() => setFlagOpen(o => !o)}>${I.flag} Flag card</button></div>
        ${flagOpen ? html`<div class="flagrow">${FLAG_REASONS.map(([k, l]) => html`<button key=${k} class="btn sm ghost" onClick=${() => onFlag(k)}>${l}</button>`)}<span class="tiny faint">Flagged cards are suspended. Review them in Settings.</span></div>` : null}
      </div>` : null}
      <div style="flex:1"></div>
      ${!revealed ? html`<button class="btn primary block" onClick=${() => setRevealed(true)}>Show answer</button><div class="kbdhint" style="text-align:center">Space to reveal · 1 to 4 to grade</div>`
      : html`<div class="grades" role="group" aria-label="How well did you recall it?">${[['again', 'Again', 1], ['hard', 'Hard', 2], ['good', 'Good', 3], ['easy', 'Easy', 4]].map(([cls, label, G]) => html`<button key=${cls} class="grade ${cls}" onClick=${() => onGrade(G)}><span>${label}</span>${P.settings.showIntervals ? html`<small>${fmtIvl(ivls[G - 1])}</small>` : null}<kbd>${G}</kbd></button>`)}</div>`}
    </div>
  </div>`;
}

/* ---------- Atlas ---------- */

    ${DOMAINS.map(d => html`<section class="card" key=${d.id} aria-labelledby=${'d-' + d.id}>

    </section>`)}

}

    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Topics</div><div class="list">${topics.map((t, i) => { const ts = topicStats(t.id, P, now), tb = P.teach[t.id]; return html`<a key=${t.id} class="item" href=${'#/atlas/topic/' + t.id}><span class="num">${i + 1}</span><div style="flex:1;min-width:0"><div class="t">${t.title}</div><div class="s">${ts.total} cards${ts.seen ? ` · ${ts.seen} seen · recall ${Math.round(ts.meanR * 100)}%` : ''}${tb ? ` · taught: ${['', 'gaps', 'some gaps', 'solid'][tb.rating]}` : ''}</div></div>${I.chev}</a>`; })}</div></div>

function TopicView({ id, P, now }) {

  const linkList = xs => html`<div class="list">${xs.map(x => html`<a key=${x.id} class="item" href=${'#/atlas/topic/' + x.id}><${Dot} domainId=${MODULE[x.moduleId].domainId} /><div style="flex:1;min-width:0"><div class="t">${x.title}</div><div class="s">${MODULE[x.moduleId].title}</div></div>${I.chev}</a>`)}</div>`;
  const submitTeach = rating => { P.recordTeach(t.id, rating); setTeachOpen(false); setRevealed(false); setText(''); };
  return html`<div class="stack">

      <textarea class="ta" style="min-height:170px" aria-label="Your explanation" value=${text} onInput=${e => setText(e.target.value)} placeholder="Start writing. No peeking."></textarea>

      : html`<div class="stack"><div class="md card inset" dangerouslySetInnerHTML=${renderMd(t.notes)}></div>
          <div><div class="small muted" style="margin-bottom:8px">How did your explanation hold up?</div><div class="grades three"><button class="grade again" onClick=${() => submitTeach(1)}>Big gaps</button><button class="grade hard" onClick=${() => submitTeach(2)}>Some gaps</button><button class="grade good" onClick=${() => submitTeach(3)}>Solid</button></div></div></div>`}
      ${tb ? html`<p class="tiny faint">Last teach-back ${new Date(tb.t).toLocaleDateString('en-GB')} · ${['', 'big gaps', 'some gaps', 'solid'][tb.rating]} · ${plural(tb.n, 'attempt')}</p>` : null}

    ${t.notes ? html`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Notes</div><div class="md" dangerouslySetInnerHTML=${renderMd(t.notes)}></div></div>` : null}
    ${t.studies && t.studies.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">${t.ext ? 'Key studies' : 'Evidence cited in your materials'}</div><div class="stack" style="gap:8px">${t.studies.map((s, i) => html`<div class="study" key=${i}><b>${s.cite}</b>${s.finding}</div>`)}</div></div>` : null}
    ${see.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Builds on your course</div>${linkList(see)}</div>` : null}
    ${further.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Go further</div>${linkList(further)}</div>` : null}
    ${t.references && t.references.length ? html`<details class="card"><summary>References (${t.references.length}) · APA 7</summary><ol class="refs">${t.references.map((r, i) => { const mk = REF_MARK[(t.refChecks || '')[i]]; return html`<li key=${i}><span dangerouslySetInnerHTML=${{ __html: refHtml(r) }}></span>${mk ? html` <span class=${'refmark ' + mk[0]} title=${mk[1]}>${mk[0] === 'ok' ? '✓' : 'official'}</span>` : null}</li>`; })}</ol><p class="tiny faint" style="margin-top:8px">✓ matched automatically in Crossref or a library catalogue. <i>official</i>: guidance, legislation or a professional body document, which Crossref does not index.</p></details>` : null}
    ${cards.length ? html`<details class="card"><summary>Cards in this topic (${cards.length})</summary><div class="list" style="margin-top:10px">${cards.map(c => { const st = P.states[c.id]; return html`<div key=${c.id}><div class="small" dangerouslySetInnerHTML=${{ __html: c.type === 'cloze' ? clozeBack(c.front) : inlineMd(c.front) }}></div><div class="tiny faint">${c.type === 'apply' ? 'scenario' : c.type} · ${P.flags[c.id] ? 'flagged' : st ? st.state + (st.state === 'review' ? ' · due ' + new Date(st.due).toLocaleDateString('en-GB') : '') : 'new'}</div></div>`; })}</div></details>` : null}

  </div>`;
}

/* ---------- Search ---------- */
function Search() {
  const [q, setQ] = useState(() => { try { return sessionStorage.getItem(NS + 'q') || ''; } catch (e) { return ''; } });
  const [dq, setDq] = useState(q);
  useEffect(() => { const t = setTimeout(() => { setDq(q); try { sessionStorage.setItem(NS + 'q', q); } catch (e) {} }, 160); return () => clearTimeout(t); }, [q]);
  const terms = dq.trim().toLowerCase().split(/\s+/).filter(x => x.length > 1);
  const res = useMemo(() => {
    if (!terms.length) return { topics: [], cards: [] };
    const idx = searchIndex(), hit = s => terms.every(x => s.includes(x));
    const topics = idx.topics.filter(x => hit(x.hay)).sort((a, b) => (hit(b.title) ? 1 : 0) - (hit(a.title) ? 1 : 0)).slice(0, 40).map(x => x.t);
    const cards = idx.cards.filter(x => hit(x.hay)).slice(0, 60).map(x => x.c);
    return { topics, cards };
  }, [dq]);
  const re = terms.length ? new RegExp('(' + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig') : null;
  const hl = txt => re ? escapeHtml(txt).replace(re, '<mark>$1</mark>') : escapeHtml(txt);
  return html`<div class="stack">
    <div><div class="eyebrow">Find anything</div><h1 class="h1">Search</h1></div>
    <label class="search">${I.search}<input type="search" aria-label="Search the Atlas" placeholder="HCR-20, Bandura, reflexive thematic analysis…" value=${q} onInput=${e => setQ(e.target.value)} autofocus /></label>
    ${terms.length && !res.topics.length && !res.cards.length ? html`<div class="empty">No matches for “${dq}”.</div>` : null}
    ${!terms.length ? html`<div class="chips">${['HCR-20', 'false confessions', 'working memory', 'NICE NG225', 'Ehlers and Clark', 'thematic analysis', 'psychopathy', 'Mental Capacity Act', 'open science', 'attachment', 'MAPPA', 'WAIS'].map(s => html`<button key=${s} class="chip" onClick=${() => setQ(s)}>${s}</button>`)}</div>` : null}
    ${res.topics.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Topics (${res.topics.length})</div><div class="list">${res.topics.map(t => html`<a key=${t.id} class="item" href=${'#/atlas/topic/' + t.id}><${Dot} domainId=${MODULE[t.moduleId].domainId} /><div style="min-width:0"><div class="t" dangerouslySetInnerHTML=${{ __html: hl(t.title) }}></div><div class="s">${MODULE[t.moduleId].title}</div></div>${I.chev}</a>`)}</div></div>` : null}
    ${res.cards.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Cards (${res.cards.length}${res.cards.length === 60 ? '+' : ''})</div><div class="list">${res.cards.map(c => html`<a key=${c.id} class="item" href=${'#/atlas/topic/' + c.topicId}><div style="min-width:0"><div class="small" dangerouslySetInnerHTML=${{ __html: hl(clozePlain(c.front)) }}></div><div class="tiny faint">${(TOPIC[c.topicId] || {}).title}</div></div>${I.chev}</a>`)}</div></div>` : null}
  </div>`;
}

/* ---------- Progress ---------- */
function Progress({ P, now }) {
  const counts = { new: 0, learning: 0, review: 0, relearning: 0 };
  for (const c of CARDS) { const st = P.states[c.id]; counts[st ? st.state : 'new']++; }
  const last30 = P.log.filter(e => e.t > now - 30 * DAY && e.s === 'review');
  const retention = last30.length >= 20 ? last30.filter(e => e.g > 1).length / last30.length : null;
  const days = 16 * 7, start = startOfDay(now) - (days - 1) * DAY;
  const perDay = {}; for (const e of P.log) { const k = dayKey(e.t); perDay[k] = (perDay[k] || 0) + 1; }
  const firstDow = (new Date(start).getDay() + 6) % 7;
  const cells = []; for (let i = 0; i < firstDow; i++) cells.push(null); for (let i = 0; i < days; i++) cells.push(start + i * DAY);
  const lvl = n => !n ? '' : n < 15 ? 'l1' : n < 40 ? 'l2' : n < 80 ? 'l3' : 'l4';
  const fc = new Array(7).fill(0); const sod = startOfDay(now);
  for (const c of CARDS) { const st = P.states[c.id]; if (!st || st.state !== 'review' || P.flags[c.id]) continue; const i = Math.max(0, Math.floor((st.due - sod) / DAY)); if (i < 7) fc[i]++; }
  const mx = Math.max(1, ...fc), active = activeSet(P.settings);
  const teachList = Object.entries(P.teach).filter(([k]) => TOPIC[k]).sort((a, b) => b[1].t - a[1].t).slice(0, 8);
  return html`<div class="stack">
    <div><div class="eyebrow">Your memory</div><h1 class="h1">Progress</h1></div>
    <div class="card"><div class="grid2">
      <div class="stat"><div class="v">${retention == null ? '–' : Math.round(retention * 100) + '%'}</div><div class="l">True retention, 30 days${retention == null ? ' (needs 20 reviews)' : ''}</div></div>
      <div class="stat"><div class="v">${streak(P.log, now)}</div><div class="l">Day streak</div></div>
      <div class="stat"><div class="v">${P.log.length.toLocaleString('en-GB')}</div><div class="l">Answers logged</div></div>
      <div class="stat"><div class="v">${Math.round(P.settings.retention * 100)}%</div><div class="l">Target retention</div></div>
    </div>${retention != null && retention < P.settings.retention - 0.05 ? html`<p class="small muted" style="margin-top:10px">Retention is running below target. Lower new cards per day for a week rather than lowering the target.</p>` : null}</div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Card states</div><div class="grid2">${[['new', 'Not started', 'easy'], ['learning', 'Learning', 'hard'], ['review', 'In review', 'good'], ['relearning', 'Relearning', 'again']].map(([k, l, c]) => html`<div class="stat" key=${k}><div class="v" style=${{ color: `var(--${c})` }}>${counts[k].toLocaleString('en-GB')}</div><div class="l">${l}</div></div>`)}</div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Activity · last 16 weeks</div><div class="heat" role="img" aria-label="Daily review activity heatmap">${cells.map((t, i) => html`<i key=${i} class=${t ? lvl(perDay[dayKey(t)]) : 'blank'} title=${t ? dayKey(t) + ': ' + (perDay[dayKey(t)] || 0) : ''}></i>`)}</div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Reviews due, next 7 days</div><div class="forecast">${fc.map((n, i) => html`<div key=${i}><span class="tiny">${n}</span><b style=${{ height: Math.max(2, Math.round(n / mx * 64)) + 'px' }}></b><span>${i === 0 ? 'Today' : new Date(now + i * DAY).toLocaleDateString('en-GB', { weekday: 'short' })}</span></div>`)}</div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Mastery by module</div>${DOMAINS.map(d => html`<div key=${d.id} style="margin-top:10px"><div class="tiny faint" style="font-weight:700;margin-bottom:4px">${d.title}</div><div class="list">${(modulesByDomain[d.id] || []).filter(m => active.has(m.id)).map(m => { const s = moduleStats(m.id, P, now); return html`<div key=${m.id}><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="small ellipsis" style="font-weight:600">${m.title}</span><span class="tiny muted" style="white-space:nowrap">${s.seen}/${s.total} · ${Math.round(s.mastery * 100)}%</span></div><div class="bar thin" style="margin-top:6px"><i style=${{ width: Math.round(s.mastery * 100) + '%', background: dvar(m.domainId) }}></i></div></div>`; })}</div></div>`)}</div>
    ${teachList.length ? html`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Recent teach-backs</div><div class="list">${teachList.map(([tid, v]) => html`<a key=${tid} class="item" href=${'#/atlas/topic/' + tid}><div><div class="t">${TOPIC[tid].title}</div><div class="s">${new Date(v.t).toLocaleDateString('en-GB')} · ${['', 'big gaps', 'some gaps', 'solid'][v.rating]}</div></div>${I.chev}</a>`)}</div></div>` : null}
  </div>`;
}

/* ---------- Settings ---------- */
function Toggle({ on, onChange, label }) { return html`<button role="switch" aria-checked=${String(!!on)} aria-label=${label} class="toggle" onClick=${() => onChange(!on)}></button>`; }
function Settings({ P, toast }) {
  const s = P.settings, active = activeSet(s), focus = focusSet(s), fileRef = useRef();
  const exportData = () => { const blob = new Blob([JSON.stringify(P.exportData())], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'psych-atlas-backup-' + dayKey(Date.now()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded'); };
  const importFile = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { toast(P.importData(JSON.parse(r.result)) ? 'Progress restored' : 'That file is not a Psych Atlas backup'); } catch (err) { toast('Could not read that file'); } }; r.readAsText(f); e.target.value = ''; };
  const toggleIn = (key, set, id) => { const n = new Set(set); n.has(id) ? n.delete(id) : n.add(id); P.setSettings({ [key]: Array.from(n), focusChosen: true }); };
  const flagged = Object.entries(P.flags).filter(([k]) => CARD[k]);
  return html`<div class="stack">
    <div><div class="eyebrow">Tune the engine</div><h1 class="h1">Settings</h1></div>
    <div class="card">
      <div class="field"><label for="ret">Target retention · ${Math.round(s.retention * 100)}%</label><div class="desc">The recall probability the scheduler aims for when a card comes back. Higher means more reviews. 85 to 90% is the efficient range.</div><input id="ret" type="range" min="80" max="97" step="1" value=${Math.round(s.retention * 100)} onInput=${e => P.setSettings({ retention: Number(e.target.value) / 100 })} /></div>
      <div class="field"><label for="npd">New cards per day</label><div class="desc">15 to 25 is sustainable. Each new card brings roughly 8 to 12 reviews in its first year.</div><input id="npd" type="number" inputmode="numeric" min="0" max="200" value=${s.newPerDay} onChange=${e => P.setSettings({ newPerDay: clamp(Number(e.target.value) || 0, 0, 200) })} /></div>
      <div class="field"><label for="mr">Max reviews per session</label><input id="mr" type="number" inputmode="numeric" min="10" max="500" value=${s.maxReviews} onChange=${e => P.setSettings({ maxReviews: clamp(Number(e.target.value) || 50, 10, 500) })} /></div>
      <div class="field"><label for="th">Theme</label><select id="th" value=${s.theme} onChange=${e => P.setSettings({ theme: e.target.value })}><option value="auto">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
      <div class="field"><label for="fs">Text size · ${s.fontSize}px</label><input id="fs" type="range" min="14" max="20" step="1" value=${s.fontSize} onInput=${e => P.setSettings({ fontSize: Number(e.target.value) })} /></div>
    </div>
    <div class="card">
      <div class="switch"><div><div style="font-weight:600">Type answers before revealing</div><div class="desc small muted">Forces full recall rather than recognition. Slower, stronger.</div></div><${Toggle} on=${s.typeAnswer} label="Type answers" onChange=${v => P.setSettings({ typeAnswer: v })} /></div>
      <div class="switch"><div><div style="font-weight:600">Show next interval on grade buttons</div></div><${Toggle} on=${s.showIntervals} label="Show intervals" onChange=${v => P.setSettings({ showIntervals: v })} /></div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:6px">Focus for new cards</div>
      <p class="small muted" style="margin-bottom:10px">New cards come only from these modules, in taught order. Reviews still come from every module you have started.</p>
      <div class="chips" style="margin-bottom:6px">${DOMAINS.map(d => html`<button key=${d.id} class="chip" onClick=${() => P.setSettings({ focus: (modulesByDomain[d.id] || []).map(m => m.id), focusChosen: true })}>${d.short} only</button>`)}<button class="chip" onClick=${() => P.setSettings({ focus: null, focusChosen: true })}>Everything</button></div>
      ${DOMAINS.map(d => html`<div key=${d.id}><div class="tiny faint" style="margin:12px 0 2px;font-weight:700">${d.title}</div>${(modulesByDomain[d.id] || []).map(m => html`<div class="switch" key=${m.id}><span class="small" style="font-weight:600">${m.title}</span><${Toggle} on=${focus.has(m.id)} label=${'Focus ' + m.title} onChange=${() => toggleIn('focus', focus, m.id)} /></div>`)}</div>`)}
    </div>
    <details class="card"><summary>Hide modules entirely (${MODULES.length - active.size} hidden)</summary>
      <p class="small muted" style="margin:8px 0">Hidden modules drop out of reviews as well as new cards. Their progress is kept.</p>
      ${MODULES.map(m => html`<div class="switch" key=${m.id}><span class="small" style="font-weight:600">${m.title}</span><${Toggle} on=${active.has(m.id)} label=${'Include ' + m.title} onChange=${() => toggleIn('activeModules', active, m.id)} /></div>`)}
    </details>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Flagged cards (${flagged.length})</div>
      ${flagged.length ? html`<p class="small muted" style="margin-bottom:8px">Suspended from all queues. Restore a card once you have checked it against the source.</p><div class="list">${flagged.map(([k, v]) => html`<div key=${k} class="row" style="flex-wrap:nowrap;gap:10px"><div style="flex:1;min-width:0"><div class="small" dangerouslySetInnerHTML=${{ __html: inlineMd(clozePlain(CARD[k].front)) }}></div><div class="tiny faint">${v.reason} · ${(TOPIC[CARD[k].topicId] || {}).title}</div></div><button class="btn sm ghost" onClick=${() => P.flag(k, null)}>Restore</button></div>`)}</div>` : html`<p class="small muted">None. Use “Flag card” on the answer side to suspend anything inaccurate or unclear.</p>`}
    </div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Your data</div>
      <p class="small muted" style="margin-bottom:10px">Progress stays on this device, in this browser only. Export a backup before clearing browser data or moving to another device, then import it there.</p>
      <div class="row"><button class="btn" onClick=${exportData}>Export backup</button><button class="btn" onClick=${() => fileRef.current.click()}>Import backup</button><input ref=${fileRef} type="file" accept="application/json,.json" style="display:none" onChange=${importFile} /></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost sm danger" onClick=${() => { if (confirm('Reset all progress on this device? This cannot be undone.')) { P.resetAll(); toast('Progress reset'); } }}>Reset all progress</button></div>
    </div>
    <p class="tiny faint">Psych Atlas ${APP_VERSION} · knowledge base ${KB.version} · <a href="#/coverage">Coverage map</a> · <a href="#/method">How this app teaches</a></p>
  </div>`;
}

/* ---------- Coverage ---------- */
const covClass = s => 'cov ' + s.toLowerCase().replace(/[^a-z]+/g, '-');
function Coverage() {
  const C = KB.coverage; if (!C) return html`<div class="empty">No coverage map in this knowledge base.</div>`;
  const chip = id => MODULE[id] ? html`<a key=${id} class="chip modchip" href=${'#/atlas/module/' + id}><${Dot} domainId=${MODULE[id].domainId} />${MODULE[id].short}</a>` : null;
  const R = C.refs;
  return html`<div class="stack">
    <${Back} label="Back" />
    <div><div class="eyebrow">Gap analysis · ${C.updated}</div><h1 class="h1">Coverage map</h1><p class="muted small" style="margin-top:4px">How complete the Atlas is against the standards a UK psychology graduate is measured by, what the degree covered, and what the extension modules added.</p></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:6px">Benchmark</div><ol class="keylearn">${C.benchmark.map((b, i) => html`<li key=${i} dangerouslySetInnerHTML=${{ __html: inlineMd(b) }}></li>`)}</ol></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Area by area</div><p class="tiny faint" style="margin-bottom:8px">Before the update, then now. ${C.scale.map(x => x.label + ': ' + x.text).join(' ')}</p>
      <div class="covlist">${C.rows.map(r => html`<div class="covrow" key=${r.area}>
        <div class="covhead"><b>${r.area}</b><span class="covstat"><span class=${covClass(r.before)}>${r.before}</span><span aria-hidden="true" class="faint">›</span><span class="sr">now</span><span class=${covClass(r.now)}>${r.now}</span></span></div>
        ${r.added ? html`<div class="small muted">${r.ext.length ? 'Added: ' : ''}${r.added}</div>` : null}
        <div class="chips" style="margin-top:6px">${r.course.map(chip)}${r.ext.map(chip)}</div>
      </div>`)}</div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:6px">Still thin, and limits</div><ul class="keypoints">${C.thin.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></div>
    ${R ? html`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Reference checks</div><p class="small">${R.text}</p></div>` : null}
  </div>`;
}

/* ---------- Method ---------- */
function Method() { return html`<div class="stack"><${Back} label="Back" /><div class="card md" dangerouslySetInnerHTML=${renderMd(window.PSYATLAS_METHOD_MD || '')}></div></div>`; }

/* ---------- App ---------- */
function App() {
  const hash = useHash();
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef();
  const toast = useCallback(msg => { setToastMsg(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 3200); }, []);
  const P = useProgress(toast);
  const [now, setNow] = useState(Date.now());
  const [updateReady, setUpdateReady] = useState(false);
  useEffect(() => { let warned = false; onQuota = () => { if (!warned) { warned = true; toast('Browser storage is full. Export a backup in Settings.'); } }; }, []);
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 60000); const vis = () => { if (!document.hidden) setNow(Date.now()); }; document.addEventListener('visibilitychange', vis); return () => { clearInterval(id); document.removeEventListener('visibilitychange', vis); }; }, []);
  useEffect(() => { const r = document.documentElement; if (P.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', P.settings.theme); r.style.setProperty('--fs', P.settings.fontSize + 'px'); }, [P.settings.theme, P.settings.fontSize]);
  useEffect(() => { setNow(Date.now()); window.scrollTo(0, 0); }, [hash]);
  useEffect(() => { if (!('serviceWorker' in navigator)) return; const had = !!navigator.serviceWorker.controller; const f = () => { if (had) setUpdateReady(true); }; navigator.serviceWorker.addEventListener('controllerchange', f); return () => navigator.serviceWorker.removeEventListener('controllerchange', f); }, []);
  const parts = hash.replace(/^#\/?/, '').split('/');
  let view;
  if (parts[0] === 'session') view = html`<${Session} key=${hash} P=${P} filterSpec=${parts[1] ? { type: parts[1], id: parts.slice(2).join('/') } : null} />`;
  else if (parts[0] === 'atlas' && parts[1] === 'module') view = html`<${ModuleView} id=${parts.slice(2).join('/')} P=${P} now=${now} />`;
  else if (parts[0] === 'atlas' && parts[1] === 'topic') view = html`<${TopicView} key=${hash} id=${parts.slice(2).join('/')} P=${P} now=${now} />`;
  else if (parts[0] === 'atlas') view = html`<${Atlas} P=${P} now=${now} />`;
  else if (parts[0] === 'search') view = html`<${Search} />`;
  else if (parts[0] === 'progress') view = html`<${Progress} P=${P} now=${now} />`;
  else if (parts[0] === 'settings') view = html`<${Settings} P=${P} toast=${toast} />`;
  else if (parts[0] === 'method') view = html`<${Method} />`;
  else if (parts[0] === 'coverage') view = html`<${Coverage} />`;
  else view = html`<${Today} P=${P} now=${now} />`;
  const dueN = useMemo(() => { const q = buildQueue(P, now); return q.reviews.length + q.learning.length; }, [P.states, P.settings, P.flags, now]);
  const inSession = parts[0] === 'session';
  return html`<${React.Fragment}>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar"><div class="topbar-in"><a class="brand" href="#/today" aria-label="Psych Atlas home"><span class="logo" aria-hidden="true">Ψ</span><span>Psych Atlas</span></a><${TopNav} hash=${hash} /><span class="spacer"></span>${dueN ? html`<a class="pill hot" href="#/session">${dueN} due</a>` : html`<span class="pill">${streak(P.log, now)} day streak</span>`}</div></header>
    <main id="main" tabindex="-1" class=${inSession ? 'in-session' : ''}>${view}</main>
    ${inSession ? null : html`<${Nav} hash=${hash} />`}
    ${toastMsg ? html`<div class="toast" role="status" aria-live="polite">${toastMsg}</div>` : null}
    ${updateReady ? html`<div class="toast" role="status">A new version is ready<button onClick=${() => location.reload()}>Reload</button></div>` : null}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();

</script>
</body>
</html>
